<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Task Manager</h1>
    <p>Student ID: <span id="student-id">73981</span></p>
  </header>

  <main>
    <form id="task-form">
      <input type="text" id="task-title" placeholder="Title" required>
      <textarea id="task-description" placeholder="Description"></textarea>
      <div class="form-buttons">
        <button type="submit" id="task-submit">Add task</button>
        <button type="button" id="task-cancel" hidden>Cancel</button>
      </div>
    </form>

    <p id="status-message"></p>

    <div id="task-list"></div>
  </main>

  <footer>
    <a id="contribution-link" href="contribution.html">Team Contribution</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
